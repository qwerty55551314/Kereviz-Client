name: Java CI with Gradle (Kereviz Client Build)

on:
  push:
    branches: [ "main", "master" ]  # 同时监听 main 和 master 分支的推送
  pull_request:
    branches: [ "main", "master" ]  # 同时监听指向 main 和 master 的 PR

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17' # 升级到 Java 17 以满足构建插件(architectury-pack200)的需求
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      # 通过添加参数，确保编译出的字节码依然兼容 Java 8
      run: ./gradlew build -PtargetCompatibility=1.8 -PsourceCompatibility=1.8

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kereviz-Client-Jar  # 网页上下载时的压缩包名称
        path: build/libs/*.jar     # 自动抓取打包生成的 jar 产物（支持直接下载）
        if-no-files-found: error