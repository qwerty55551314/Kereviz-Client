name: Java CI with Gradle (Kereviz Client Build)

on:
  push:
    branches: [ "main", "master" ]  # 同时监听 main 和 master 分支的推送
  pull_request:
    branches: [ "main", "master" ]  # 同时监听指向 main 和 master 的 PR

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8' # 1.8.9 客户端通常需要 JDK 8 环境构建
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kereviz-Client-Jar  # 网页上下载时的压缩包名称
        path: build/libs/*.jar     # 自动抓取打包生成的 jar 产物（支持直接下载）
        if-no-files-found: error
